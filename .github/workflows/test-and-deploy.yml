name: Test and Deploy
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run automatically at 8AM PST Monday-Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  test:
    name: Test - Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-x64
    if: github.repository_owner == 'sendgrid'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '3.1', '3.2', '3.3', '3.4' ]
    steps:
      - name: Checkout sendgrid-ruby
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@0375437914d535a5fb178bdbfdb5d51bdde2616e # v1
        with:
          ecosystem: ruby

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: make install

      - name: Set up linter
        run: bundle add rubocop --version "~> 1.24.1" --group "development" --skip-install

      - run: bundle install --with development

      - name: Run linter
        run: bundle exec rubocop

      - name: Run tests
        run: make test-docker version=ruby:${{ matrix.ruby }}

  deploy:
    name: Deploy
    if: success() && github.ref_type == 'tag' && github.repository_owner == 'sendgrid'
    needs: [ test ]
    runs-on: ubuntu-x64
    environment:
      name: production
      url: https://rubygems.org/gems/sendgrid-ruby
    permissions:
      contents: write          # required for creating GitHub Release
      id-token: write
    steps:
      - name: Checkout sendgrid-ruby
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The release action verifies refs/tags/<tag> in the local clone.
          fetch-depth: 0

      - name: Artifactory OIDC Auth
        uses: twilio/sdk-actions/artifactory-oidc@0375437914d535a5fb178bdbfdb5d51bdde2616e # v1
        with:
          ecosystem: ruby

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: make install

      - name: Create GitHub Release
        uses: twilio/sdk-actions/github-release@9b1c3222c9ffe38aadedb11c5b9f5a172b5e9951 # v1
        with:
          changelog-file: CHANGELOG.md
          footer: '**[RubyGems](https://rubygems.org/gems/sendgrid-ruby/versions/${{ github.ref_name }})**'

      # RubyGems trusted publishing (OIDC) - no API key. A trusted publisher must be
      # configured on rubygems.org for this gem, repo and workflow.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: |
          gem build *.gemspec
          gem push *.gem

